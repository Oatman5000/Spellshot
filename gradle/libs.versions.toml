# hyboot is deliberately absent. It was Spookline's platform -- coordinator,
# matchmaking and cross-server user store -- and this port replaced all of it with
# standalone equivalents (see "Differences from upstream" in the README). The
# version and its two library entries lingered here long after the last reference
# was removed from every build script.

[versions]
# The Hytale server API, compileOnly in all three modules.
#
# MUST match the server the plugin actually runs on. A mismatch does not fail the
# build -- it fails at runtime, usually as NoSuchMethodError deep inside a tick, or
# as assets that silently refuse to load.
#
# Was 0.5.7 (Update 5) while the local install ran 0.5.9, which is why
# StartServer.bat had to launch the install's own jar rather than this one. Both
# sides are 0.6.0 now.
hytaleServer = "0.6.0"

kotlin = "2.3.0"
kotlinSpring = "2.3.0-RC3"
kotlinxSerialization = "1.9.0"
springBoot = "4.0.0"
shadow = "9.3.1"
slf4j = "2.0.9"

[libraries]
hytaleServer = { module = "com.hypixel.hytale:Server", version.ref = "hytaleServer" }
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
slf4jSimple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
springBoot = { module = "org.springframework.boot:spring-boot", version.ref = "springBoot" }
kotlinxSerializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

[plugins]
kotlinPluginSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlinPluginSpring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlinSpring" }
springBootPlugin = { id = "org.springframework.boot", version.ref = "springBoot" }
springDependencyManagement = { id = "io.spring.dependency-management", version = "1.1.7" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }