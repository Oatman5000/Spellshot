services:
  mongo:
    image: mongo:latest
    container_name: mongo_container
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}

  redis:
    image: redis:latest
    container_name: redis_container
    command: [ "redis-server", "--requirepass", "${REDIS_PASSWORD}" ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  control:
    image: ghcr.io/averix-enterprise/hyboot-control:latest
    container_name: hyboot_control
    depends_on:
      - redis
      - mongo
    ports:
      - "8080:8080"
    environment:
      - HYBOOT_DATASTORE_REMOTE_TYPE=MONGODB
      - HYBOOT_DATASTORE_REMOTE_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo_container:27017
      - HYBOOT_COORDINATOR_TYPE=REDIS
      - HYBOOT_COORDINATOR_URI=redis://redis_container:6379
      - HYBOOT_COORDINATOR_PASSWORD=${REDIS_PASSWORD}

volumes:
  mongo_data:
  redis_data: