hyboot {
  coordinator {
    type = REDIS
    uri = "redis://localhost:6379"
    password = "secretpassword"
  }

  identity {
    id = moshpit
    name = "Moshpit"
    tags = ["moshpit"]
  }

  datastore.remote {
    type = MONGODB
    uri = "mongodb://root:secretpassword@localhost:27017"
  }

  users {
    sessionExpiry = 30000
  }
}

hytale {
  authLeasing = true
  disallowReclaiming = false
  bind = 0.0.0.0
  port = 5081
  assetsFile = "../../Assets.zip"
}